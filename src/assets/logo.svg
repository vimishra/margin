<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Margin: the rule down the side of the page, and the lines of text beside it. -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8E7BFF"/>
      <stop offset="0.55" stop-color="#5B4FE0"/>
      <stop offset="1" stop-color="#3A2FB8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1E1B6B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g transform="translate(0 0) scale(1.0)">
    <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
    <rect width="1024" height="1024" rx="232" fill="url(#sheen)"/>
    <g filter="url(#soft)">
      <rect x="262" y="252" width="76" height="520" rx="38" fill="#FF7A70"/>
      <rect x="420" y="282" width="342" height="92" rx="46" fill="#FFFFFF"/>
      <rect x="420" y="466" width="342" height="92" rx="46" fill="#FFFFFF" fill-opacity="0.82"/>
      <rect x="420" y="650" width="206" height="92" rx="46" fill="#FFFFFF" fill-opacity="0.62"/>
    </g>
  </g>
</svg>
